name: Unicode

on:
  schedule:
    # Unicode publishes one release per year, in September. Checking monthly
    # costs a job that opens nothing the other eleven times, and does not lose a
    # year when a single run fails.
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Update the Unicode tables"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      # Fails when Unicode adds a Word_Break value the WordBreakProperty enum
      # does not cover, which needs a human.
      - name: "Regenerate the tables"
        run: python3 ./tools/gen_unicode_tables.py

      - name: "Open a pull request"
        uses: peter-evans/create-pull-request@v8
        with:
          branch: unicode-tables-update
          title: "Update the Unicode tables"
          commit-message: "Update the Unicode tables"
          body: >
            Regenerated by `tools/gen_unicode_tables.py` from the latest
            released Unicode Character Database. The version is in the header of
            `src/ftxui/screen/string_unicode_tables.ipp`.


            Widening a code point changes how existing text is laid out, so it
            is worth checking which reclassifications a release brings before
            merging.


            GitHub does not run workflows on pull requests opened by
            `GITHUB_TOKEN`, so CI has to be started by hand: closing and
            reopening this pull request is enough.
