name: Shared Library Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Which platforms run for this event is defined in tools/ci_matrix.json.
  select_matrix:
    name: "Select matrix"
    runs-on: ubuntu-latest
    outputs:
      shared_lib: ${{ steps.select.outputs.shared_lib }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Select the matrices for ${{ github.event_name }}"
        id: select
        run: ./tools/select_ci_matrix.sh >> "$GITHUB_OUTPUT"

  build-shared:
    needs: select_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select_matrix.outputs.shared_lib) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DBUILD_SHARED_LIBS=ON \
            -DFTXUI_BUILD_EXAMPLES=ON \
            -DFTXUI_BUILD_TESTS=OFF \
            -DFTXUI_BUILD_DOCS=OFF

      - name: Build one example
        run: |
          cmake --build build --target ftxui_example_text
